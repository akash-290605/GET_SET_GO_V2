name: Build & Deploy Flutter Web & Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Deploy Web App (Builds in ~60-90 seconds)
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🌐 Build Flutter Web
        run: |
          flutter build web --release --base-href "/GET_SET_GO/"
          touch build/web/.nojekyll

      # 1. Deploy to GitHub Pages branch (gh-pages)
      - name: 🚀 Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true

      # 2. Native GitHub Actions Pages Deploy
      - name: 📦 Upload Web Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: 🌍 Deploy to GitHub Pages Action
        id: deployment
        uses: actions/deploy-pages@v4

  # Build Android APK in parallel
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 📱 Build Android APK
        run: flutter build apk --debug

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GET_SET_GO-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
