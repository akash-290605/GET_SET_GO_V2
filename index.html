<head>
  <base href="/GET_SET_GO/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GET SET GO - Growth & Discipline Engine">

  <!-- Cache busting headers to prevent stale browser caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GET SET GO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GET SET GO</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Auto purge old service workers and stale CacheStorage on fresh load
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }

    // Dynamically load flutter_bootstrap.js with cache-busting timestamp
    var script = document.createElement('script');
    script.src = 'flutter_bootstrap.js?v=' + Date.now();
    script.async = true;
    document.body.appendChild(script);
  </script>
</body>
</html>
